<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Token Counter</title>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Google Sans', 'Segoe UI', sans-serif;
            background: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            padding: 40px;
            max-width: 640px;
            width: 100%;
        }
        h1 {
            color: #1a73e8;
            font-size: 24px;
            margin-bottom: 8px;
        }
        .subtitle {
            color: #5f6368;
            font-size: 14px;
            margin-bottom: 24px;
        }
        label {
            font-size: 13px;
            color: #5f6368;
            display: block;
            margin-bottom: 6px;
        }
        .field { margin-bottom: 20px; }
        input[type="password"], input[type="text"] {
            width: 100%;
            border: 2px solid #dadce0;
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus { border-color: #1a73e8; }
        textarea {
            width: 100%;
            height: 200px;
            border: 2px solid #dadce0;
            border-radius: 12px;
            padding: 16px;
            font-size: 15px;
            font-family: inherit;
            resize: vertical;
            transition: border-color 0.2s;
            outline: none;
        }
        textarea:focus { border-color: #1a73e8; }
        button {
            margin-top: 16px;
            background: #1a73e8;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 28px;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background: #1557b0; }
        button:disabled { background: #a8c7fa; cursor: not-allowed; }
        .result {
            margin-top: 24px;
            padding: 20px;
            background: #e8f0fe;
            border-radius: 12px;
            display: none;
        }
        .result.visible { display: block; }
        .token-count {
            font-size: 48px;
            font-weight: 700;
            color: #1a73e8;
        }
        .token-label {
            font-size: 14px;
            color: #5f6368;
            margin-top: 4px;
        }
        .error {
            margin-top: 16px;
            color: #d93025;
            font-size: 14px;
            display: none;
        }
        .error.visible { display: block; }
        .info {
            margin-top: 16px;
            font-size: 13px;
            color: #80868b;
        }
        .info a { color: #1a73e8; text-decoration: none; }
        .info a:hover { text-decoration: underline; }
        code { background: #f1f3f4; padding: 2px 6px; border-radius: 4px; font-size: 13px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Gemini Token Counter</h1>
        <p class="subtitle">Count tokens using the Gemini API's <code>countTokens</code> endpoint &mdash; no LLM call.</p>

        <div class="field">
            <label for="model-input">Model</label>
            <input type="text" id="model-input" value="gemini-2.5-flash" placeholder="e.g. gemini-2.5-flash">
        </div>

        <textarea id="text-input" placeholder="Type or paste your text here..."></textarea>
        <button id="count-btn" onclick="countTokens()">Count Tokens</button>

        <div class="result" id="result">
            <div class="token-count" id="token-count">0</div>
            <div class="token-label">tokens</div>
        </div>

        <div class="error" id="error"></div>

        <p class="info">~100 tokens = 60-80 English words &bull; <a href="models.html">Browse all models</a></p>
    </div>

    <script>
        async function countTokens() {
            const model = document.getElementById('model-input').value.trim();
            const text = document.getElementById('text-input').value;
            const btn = document.getElementById('count-btn');
            const result = document.getElementById('result');
            const error = document.getElementById('error');

            error.classList.remove('visible');

            if (!model) {
                error.textContent = 'Please enter a model name.';
                error.classList.add('visible');
                return;
            }

            if (!text.trim()) {
                result.classList.add('visible');
                document.getElementById('token-count').textContent = '0';
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Counting...';

            try {
                const resp = await fetch('/count', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text, model }),
                });

                const data = await resp.json();
                if (data.error) throw new Error(data.error);

                document.getElementById('token-count').textContent = data.totalTokens;
                result.classList.add('visible');
            } catch (err) {
                error.textContent = err.message;
                error.classList.add('visible');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Count Tokens';
            }
        }

        document.getElementById('text-input').addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) countTokens();
        });
    </script>
</body>
</html>

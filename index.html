<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src https://generativelanguage.googleapis.com;">
    <title>Gemini Tools</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="nav.css">
    <style>
        :root {
            --bg: #f8f9fc;
            --bg-elevated: #ffffff;
            --bg-card: #ffffff;
            --bg-card-hover: #ffffff;
            --border: #e4e7ee;
            --border-focus: #4f46e5;
            --text: #111318;
            --text-secondary: #4b5060;
            --text-muted: #8b90a0;
            --accent: #4f46e5;
            --accent-hover: #4338ca;
            --accent-soft: #eef2ff;
            --green: #059669;
            --green-soft: #ecfdf5;
            --red: #dc2626;
            --red-soft: #fef2f2;
            --amber: #d97706;
            --amber-soft: #fffbeb;
            --purple: #7c3aed;
            --purple-soft: #f5f3ff;
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
            --shadow-md: 0 4px 16px rgba(0,0,0,0.06);
            --shadow-lg: 0 12px 40px rgba(0,0,0,0.1);
            --radius: 16px;
            --dot-color: #d8dbe4;
        }

        [data-theme="dark"] {
            --bg: #0b0e14;
            --bg-elevated: #141824;
            --bg-card: #161b2a;
            --bg-card-hover: #1c2236;
            --border: #232a3e;
            --border-focus: #818cf8;
            --text: #eceef4;
            --text-secondary: #9399ae;
            --text-muted: #5c6280;
            --accent: #818cf8;
            --accent-hover: #a5b4fc;
            --accent-soft: #1e1b4b40;
            --green: #34d399;
            --green-soft: #05966920;
            --red: #f87171;
            --red-soft: #dc262620;
            --amber: #fbbf24;
            --amber-soft: #d9770620;
            --purple: #a78bfa;
            --purple-soft: #7c3aed20;
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.2);
            --shadow-md: 0 4px 16px rgba(0,0,0,0.25);
            --shadow-lg: 0 12px 40px rgba(0,0,0,0.35);
            --dot-color: #1e2438;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            transition: background 0.3s, color 0.3s;
            position: relative;
        }

        /* Dot grid background */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: radial-gradient(var(--dot-color) 1px, transparent 1px);
            background-size: 24px 24px;
            pointer-events: none;
            z-index: 0;
        }

        /* Gradient orb behind hero */
        body::after {
            content: '';
            position: fixed;
            top: -120px;
            right: -80px;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, var(--accent) 0%, transparent 70%);
            opacity: 0.05;
            pointer-events: none;
            z-index: 0;
        }

        .hero {
            position: relative;
            z-index: 1;
            max-width: 1200px;
            margin: 0 auto;
            padding: 60px 32px 20px;
        }

        .hero-label {
            font-family: 'Space Mono', monospace;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--accent);
            margin-bottom: 16px;
            opacity: 0;
            animation: fadeUp 0.6s ease forwards;
        }

        .hero h1 {
            font-size: clamp(36px, 5vw, 56px);
            font-weight: 700;
            letter-spacing: -0.035em;
            line-height: 1.1;
            color: var(--text);
            margin-bottom: 12px;
            opacity: 0;
            animation: fadeUp 0.6s ease 0.1s forwards;
        }

        .hero h1 span {
            background: linear-gradient(135deg, var(--accent), var(--purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .hero p {
            font-size: 17px;
            color: var(--text-secondary);
            max-width: 520px;
            line-height: 1.6;
            opacity: 0;
            animation: fadeUp 0.6s ease 0.2s forwards;
        }

        .tool-count {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 20px;
            padding: 6px 14px;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: 100px;
            font-family: 'Space Mono', monospace;
            font-size: 12px;
            color: var(--text-muted);
            opacity: 0;
            animation: fadeUp 0.6s ease 0.3s forwards;
            box-shadow: var(--shadow-sm);
        }

        .tool-count strong {
            color: var(--accent);
            font-size: 14px;
        }

        /* Sections */
        .sections {
            position: relative;
            z-index: 1;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px 32px 80px;
        }

        .section {
            margin-bottom: 48px;
            opacity: 0;
            animation: fadeUp 0.5s ease forwards;
        }

        .section:nth-child(1) { animation-delay: 0.35s; }
        .section:nth-child(2) { animation-delay: 0.45s; }
        .section:nth-child(3) { animation-delay: 0.55s; }
        .section:nth-child(4) { animation-delay: 0.65s; }
        .section:nth-child(5) { animation-delay: 0.75s; }

        .section-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
        }

        .section-icon {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
        }

        .section-title {
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-muted);
        }

        .section-line {
            flex: 1;
            height: 1px;
            background: var(--border);
            margin-left: 8px;
        }

        /* Cards Grid */
        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
        }

        .card {
            position: relative;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
            cursor: pointer;
            box-shadow: var(--shadow-sm);
        }

        /* Colored left accent bar */
        .card::before {
            content: '';
            position: absolute;
            top: 12px;
            left: 0;
            bottom: 12px;
            width: 3px;
            border-radius: 0 3px 3px 0;
            background: var(--card-accent, var(--accent));
            opacity: 0;
            transform: scaleY(0);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        /* Glow effect behind card on hover */
        .card::after {
            content: '';
            position: absolute;
            inset: -1px;
            border-radius: var(--radius);
            background: radial-gradient(
                600px circle at var(--mouse-x, 50%) var(--mouse-y, 50%),
                var(--card-glow, rgba(79, 70, 229, 0.06)),
                transparent 40%
            );
            opacity: 0;
            transition: opacity 0.4s ease;
            pointer-events: none;
            z-index: 0;
        }

        .card > * {
            position: relative;
            z-index: 1;
        }

        .card:hover {
            border-color: color-mix(in srgb, var(--card-accent, var(--accent)) 40%, var(--border));
            box-shadow: var(--shadow-lg), 0 0 0 1px color-mix(in srgb, var(--card-accent, var(--accent)) 10%, transparent);
            transform: translateY(-3px);
            background: var(--bg-card-hover);
        }

        .card:hover::before {
            opacity: 1;
            transform: scaleY(1);
        }

        .card:hover::after {
            opacity: 1;
        }

        .card-top {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            margin-bottom: 14px;
        }

        .card-emoji {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            background: var(--card-bg, var(--accent-soft));
            flex-shrink: 0;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 2px 8px color-mix(in srgb, var(--card-accent, var(--accent)) 12%, transparent);
        }

        .card:hover .card-emoji {
            transform: scale(1.08) rotate(-3deg);
            box-shadow: 0 4px 14px color-mix(in srgb, var(--card-accent, var(--accent)) 20%, transparent);
        }

        .card-arrow {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            color: var(--text-muted);
            font-size: 14px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            opacity: 0;
            transform: translateX(-6px);
        }

        .card:hover .card-arrow {
            opacity: 1;
            transform: translateX(0);
            background: var(--card-accent, var(--accent));
            border-color: var(--card-accent, var(--accent));
            color: #fff;
        }

        .card-name {
            font-size: 17px;
            font-weight: 600;
            letter-spacing: -0.015em;
            margin-bottom: 6px;
            color: var(--text);
            transition: color 0.25s;
        }

        .card:hover .card-name {
            color: var(--card-accent, var(--accent));
        }

        .card-desc {
            font-size: 13.5px;
            color: var(--text-muted);
            line-height: 1.55;
            margin-bottom: 2px;
            transition: color 0.25s;
        }

        .card:hover .card-desc {
            color: var(--text-secondary);
        }

        .card-tag {
            display: inline-flex;
            align-items: center;
            align-self: flex-start;
            margin-top: 14px;
            padding: 4px 12px;
            border-radius: 100px;
            font-family: 'Space Mono', monospace;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--card-accent, var(--accent));
            background: var(--card-bg, var(--accent-soft));
            border: 1px solid color-mix(in srgb, var(--card-accent, var(--accent)) 15%, transparent);
            transition: all 0.25s ease;
        }

        .card:hover .card-tag {
            background: color-mix(in srgb, var(--card-accent, var(--accent)) 12%, transparent);
            border-color: color-mix(in srgb, var(--card-accent, var(--accent)) 25%, transparent);
        }

        /* Category colors */
        .section[data-cat="explore"] { --cat-accent: #4f46e5; --cat-bg: #eef2ff; --cat-glow: rgba(79, 70, 229, 0.06); }
        .section[data-cat="multimodal"] { --cat-accent: #0891b2; --cat-bg: #ecfeff; --cat-glow: rgba(8, 145, 178, 0.06); }
        .section[data-cat="research"] { --cat-accent: #059669; --cat-bg: #ecfdf5; --cat-glow: rgba(5, 150, 105, 0.06); }
        .section[data-cat="tools"] { --cat-accent: #7c3aed; --cat-bg: #f5f3ff; --cat-glow: rgba(124, 58, 237, 0.06); }
        .section[data-cat="create"] { --cat-accent: #d97706; --cat-bg: #fffbeb; --cat-glow: rgba(217, 119, 6, 0.06); }

        [data-theme="dark"] .section[data-cat="explore"] { --cat-bg: #4f46e518; --cat-glow: rgba(99, 102, 241, 0.08); }
        [data-theme="dark"] .section[data-cat="multimodal"] { --cat-bg: #0891b218; --cat-glow: rgba(8, 145, 178, 0.08); }
        [data-theme="dark"] .section[data-cat="research"] { --cat-bg: #05966918; --cat-glow: rgba(52, 211, 153, 0.08); }
        [data-theme="dark"] .section[data-cat="tools"] { --cat-bg: #7c3aed18; --cat-glow: rgba(167, 139, 250, 0.08); }
        [data-theme="dark"] .section[data-cat="create"] { --cat-bg: #d9770618; --cat-glow: rgba(251, 191, 36, 0.08); }

        .section[data-cat] .card {
            --card-accent: var(--cat-accent);
            --card-bg: var(--cat-bg);
            --card-glow: var(--cat-glow);
        }

        /* Animations */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Responsive */
        @media (max-width: 640px) {
            .hero { padding: 40px 20px 12px; }
            .sections { padding: 16px 20px 60px; }
            .cards { grid-template-columns: 1fr; gap: 12px; }
            .hero h1 { font-size: 32px; }
            .card-arrow { opacity: 1; transform: translateX(0); }
            .card::before { opacity: 1; transform: scaleY(1); }
        }
    </style>
    <script>
        (function() {
            var t = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', t);
        })();
    </script>
</head>
<body>

<div class="hero">
    <div class="hero-label">Gemini API Toolkit</div>
    <h1>Explore <span>Gemini</span> Tools</h1>
    <p>Interactive browser tools for the Gemini API. No setup required &mdash; just add your API key and start experimenting.</p>
    <div class="tool-count"><strong>20</strong> tools across 5 categories</div>
</div>

<div class="sections" id="sections"></div>

<script>
(function() {
    var tools = [
        { cat: 'Create', catId: 'create', icon: '\u{1F3A8}', items: [
            { href: 'tts.html', icon: '\u{1F399}\uFE0F', name: 'Text to Speech', desc: 'Generate natural-sounding speech from text with multiple voice options.', tag: 'Audio' },
            { href: 'story.html', icon: '\u{1F4D6}', name: 'Story Illustrator', desc: 'Generate illustrated storybooks with consistent characters and scenes.', tag: 'Images' },
            { href: 'animate.html', icon: '\u{1F3AC}', name: 'Animated Video', desc: 'Create AI-generated story videos with narration and animation.', tag: 'Video' },
        ]},
        { cat: 'Tools', catId: 'tools', icon: '\u2699\uFE0F', items: [
            { href: 'think.html', icon: '\u{1F9E0}', name: 'Thinking', desc: 'See the model\'s step-by-step reasoning process for complex problems.', tag: 'Reasoning' },
            { href: 'code.html', icon: '\u{1F4BB}', name: 'Code Runner', desc: 'Generate and execute Python code with automatic error correction.', tag: 'Execution' },
            { href: 'maps.html', icon: '\u{1F5FA}\uFE0F', name: 'Maps', desc: 'Location-aware queries with Google Maps integration and visualization.', tag: 'Grounding' },
            { href: 'extract.html', icon: '\u{1F4CB}', name: 'Extractor', desc: 'Extract structured data from unstructured text using JSON schemas.', tag: 'Structured' },
            { href: 'embed.html', icon: '\u{1F9EE}', name: 'Embeddings', desc: 'Compute text embeddings and measure semantic similarity between passages.', tag: 'Vectors' },
        ]},
        { cat: 'Research', catId: 'research', icon: '\u{1F9E0}', items: [
            { href: 'prompt.html', icon: '\u{1F4AC}', name: 'Playground', desc: 'Chat with Gemini using custom system instructions and model parameters.', tag: 'Chat' },
            { href: 'search.html', icon: '\u{1F310}', name: 'Search', desc: 'Grounded search with Google. Get real-time, cited answers.', tag: 'Grounding' },
            { href: 'pdf.html', icon: '\u{1F4C4}', name: 'PDF Analyzer', desc: 'Upload PDFs and query their content with AI-powered analysis.', tag: 'Documents' },
            { href: 'url.html', icon: '\u{1F517}', name: 'URL Context', desc: 'Summarize and analyze web pages by providing a URL.', tag: 'Web' },
            { href: 'files.html', icon: '\u{1F4C2}', name: 'File Search', desc: 'Upload documents and search across them with natural language.', tag: 'Documents' },
            { href: 'research.html', icon: '\u{1F50E}', name: 'Deep Research', desc: 'Multi-step research agent that synthesizes information across sources.', tag: 'Agent' },
            { href: 'live.html', icon: '\u{1F3A4}', name: 'Live Chat', desc: 'Real-time voice and text conversation over WebSocket with the Live API.', tag: 'Streaming' },
        ]},
        { cat: 'Multimodal', catId: 'multimodal', icon: '\u{1F441}', items: [
            { href: 'describe.html', icon: '\u{1F5BC}', name: 'Image Describer', desc: 'Upload any image and get detailed AI-generated descriptions and analysis.', tag: 'Vision' },
            { href: 'detect.html', icon: '\u{1F3AF}', name: 'Object Detector', desc: 'Detect and locate objects in images with labeled bounding boxes.', tag: 'Vision' },
            { href: 'video.html', icon: '\u{1F3AC}', name: 'Video Analyzer', desc: 'Upload videos and ask questions about their content, scenes, and details.', tag: 'Vision' },
        ]},
        { cat: 'Model Metadata', catId: 'explore', icon: '\u{1F4CA}', items: [
            { href: 'tokens.html', icon: '\u{1F522}', name: 'Token Counter', desc: 'Count tokens for text, images, and files. Estimate costs across all Gemini models.', tag: 'Core' },
            { href: 'models.html', icon: '\u{1F916}', name: 'Model Explorer', desc: 'Browse all available Gemini models with specs, pricing, and capability details.', tag: 'Reference' },
        ]},
    ];

    var container = document.getElementById('sections');

    tools.forEach(function(cat) {
        var section = document.createElement('div');
        section.className = 'section';
        section.setAttribute('data-cat', cat.catId);

        var header = document.createElement('div');
        header.className = 'section-header';

        var icon = document.createElement('div');
        icon.className = 'section-icon';
        icon.style.background = 'var(--cat-bg)';
        icon.textContent = cat.icon;
        header.appendChild(icon);

        var title = document.createElement('span');
        title.className = 'section-title';
        title.textContent = cat.cat;
        header.appendChild(title);

        var line = document.createElement('div');
        line.className = 'section-line';
        header.appendChild(line);

        section.appendChild(header);

        var grid = document.createElement('div');
        grid.className = 'cards';

        cat.items.forEach(function(item) {
            var a = document.createElement('a');
            a.className = 'card';
            a.href = item.href;

            // Track mouse position for glow effect
            a.addEventListener('mousemove', function(e) {
                var rect = a.getBoundingClientRect();
                a.style.setProperty('--mouse-x', (e.clientX - rect.left) + 'px');
                a.style.setProperty('--mouse-y', (e.clientY - rect.top) + 'px');
            });

            var top = document.createElement('div');
            top.className = 'card-top';

            var emoji = document.createElement('div');
            emoji.className = 'card-emoji';
            emoji.textContent = item.icon;
            top.appendChild(emoji);

            var arrow = document.createElement('div');
            arrow.className = 'card-arrow';
            arrow.textContent = '\u2192';
            top.appendChild(arrow);

            a.appendChild(top);

            var name = document.createElement('div');
            name.className = 'card-name';
            name.textContent = item.name;
            a.appendChild(name);

            var desc = document.createElement('div');
            desc.className = 'card-desc';
            desc.textContent = item.desc;
            a.appendChild(desc);

            var tag = document.createElement('span');
            tag.className = 'card-tag';
            tag.textContent = item.tag;
            a.appendChild(tag);

            grid.appendChild(a);
        });

        section.appendChild(grid);
        container.appendChild(section);
    });
})();
</script>

<script src="nav.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src https://generativelanguage.googleapis.com;">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0c0f1a;
            --bg-elevated: #141829;
            --bg-card: #1a1f35;
            --bg-input: #10132280;
            --border: #2a3050;
            --border-focus: #f0b232;
            --text: #e8eaf0;
            --text-muted: #7a82a0;
            --text-dim: #4a5070;
            --accent: #f0b232;
            --accent-glow: #f0b23240;
            --accent-dim: #f0b23218;
            --green: #34d399;
            --green-dim: #34d39920;
            --red: #f87171;
            --red-dim: #f8717120;
            --blue: #60a5fa;
            --blue-dim: #60a5fa18;
            --amber: #fbbf24;
            --amber-dim: #fbbf2418;
            --purple: #a78bfa;
            --purple-dim: #a78bfa18;
            --font-display: 'Instrument Serif', serif;
            --font-body: 'DM Sans', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--font-body);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 32px 24px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(ellipse at 30% 20%, #f0b23208 0%, transparent 50%),
                        radial-gradient(ellipse at 70% 80%, #60a5fa06 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .page {
            position: relative;
            z-index: 1;
            max-width: 1000px;
            margin: 0 auto;
        }

        /* Header */
        .header {
            margin-bottom: 32px;
            animation: fadeUp 0.5s ease-out;
        }

        .nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
        }

        .nav-brand {
            font-family: var(--font-mono);
            font-size: 11px;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--text-muted);
        }

        .nav-link {
            font-family: var(--font-mono);
            font-size: 12px;
            color: var(--text-muted);
            text-decoration: none;
            padding: 6px 14px;
            border: 1px solid var(--border);
            border-radius: 6px;
            transition: all 0.25s;
        }

        .nav-link:hover {
            color: var(--accent);
            border-color: var(--accent);
            background: var(--accent-dim);
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 24px;
            flex-wrap: wrap;
        }

        .header-left {
            flex: 1;
            min-width: 280px;
        }

        h1 {
            font-family: var(--font-display);
            font-size: 48px;
            font-weight: 400;
            line-height: 1.05;
            color: var(--text);
            margin-bottom: 10px;
        }

        h1 em {
            color: var(--accent);
            font-style: italic;
        }

        .subtitle {
            font-size: 14px;
            color: var(--text-muted);
            line-height: 1.5;
        }

        .header-controls {
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }

        .header-controls .field {
            min-width: 260px;
        }

        label {
            display: block;
            font-family: var(--font-mono);
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        input[type="password"],
        input[type="text"] {
            width: 100%;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px 16px;
            font-family: var(--font-mono);
            font-size: 13px;
            color: var(--text);
            outline: none;
            transition: all 0.25s;
        }

        input:focus {
            border-color: var(--border-focus);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        input::placeholder {
            color: var(--text-dim);
        }

        button {
            background: var(--accent);
            color: var(--bg);
            border: none;
            border-radius: 10px;
            padding: 13px 28px;
            font-family: var(--font-body);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s;
            white-space: nowrap;
        }

        button:hover {
            background: #f5c04a;
            transform: translateY(-1px);
            box-shadow: 0 6px 20px var(--accent-glow);
        }

        button:active { transform: translateY(0); }

        button:disabled {
            background: var(--text-dim);
            color: var(--bg-card);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .privacy-notice {
            margin-top: 16px;
            padding: 10px 14px;
            background: var(--green-dim);
            border: 1px solid #34d39925;
            border-radius: 8px;
            font-size: 11px;
            color: var(--green);
            line-height: 1.5;
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .privacy-icon {
            flex-shrink: 0;
            width: 14px;
            height: 14px;
        }

        /* Toolbar */
        .toolbar {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 18px 22px;
            margin-bottom: 24px;
            position: sticky;
            top: 16px;
            z-index: 10;
            backdrop-filter: blur(12px);
            display: none;
            animation: fadeUp 0.4s ease-out;
        }

        .toolbar.visible { display: block; }

        .toolbar input {
            margin-bottom: 14px;
        }

        .stats {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .stat-chip {
            background: var(--bg-elevated);
            color: var(--text-muted);
            border-radius: 20px;
            padding: 6px 16px;
            font-family: var(--font-mono);
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            user-select: none;
            border: 1px solid var(--border);
        }

        .stat-chip:hover {
            color: var(--text);
            border-color: var(--text-muted);
        }

        .stat-chip.active {
            background: var(--accent);
            color: var(--bg);
            border-color: var(--accent);
        }

        .model-count {
            font-family: var(--font-mono);
            font-size: 12px;
            color: var(--text-dim);
            margin-bottom: 16px;
            display: none;
        }

        /* Error */
        .error {
            background: var(--red-dim);
            border: 1px solid #f8717130;
            border-radius: 12px;
            padding: 14px 20px;
            color: var(--red);
            font-size: 13px;
            margin-bottom: 20px;
            display: none;
            animation: shake 0.4s ease-out;
        }

        .error.visible { display: block; }

        /* Model grid */
        .model-grid {
            display: grid;
            gap: 14px;
        }

        .model-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 26px;
            transition: all 0.25s;
            animation: fadeUp 0.4s ease-out both;
        }

        .model-card:hover {
            border-color: var(--text-dim);
            transform: translateY(-2px);
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }

        .model-card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 10px;
        }

        .model-name {
            font-family: var(--font-body);
            font-size: 16px;
            font-weight: 600;
            color: var(--text);
        }

        .model-id {
            font-family: var(--font-mono);
            font-size: 12px;
            color: var(--text-dim);
            margin-top: 3px;
        }

        .model-version {
            font-family: var(--font-mono);
            font-size: 10px;
            color: var(--accent);
            background: var(--accent-dim);
            border: 1px solid #f0b23230;
            border-radius: 4px;
            padding: 3px 8px;
            white-space: nowrap;
        }

        .model-description {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 18px;
            line-height: 1.6;
        }

        .model-stats {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .model-stat {
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px 16px;
            flex: 1;
            min-width: 110px;
        }

        .model-stat-value {
            font-family: var(--font-mono);
            font-size: 18px;
            font-weight: 700;
            color: var(--blue);
        }

        .model-stat-label {
            font-family: var(--font-mono);
            font-size: 10px;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: var(--text-dim);
            margin-top: 4px;
        }

        .model-pricing {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .model-pricing-stat {
            background: var(--amber-dim);
            border: 1px solid #fbbf2420;
            border-radius: 10px;
            padding: 12px 16px;
            flex: 1;
            min-width: 110px;
        }

        .model-pricing-stat .model-stat-value {
            color: var(--amber);
            font-size: 16px;
        }

        .pricing-note {
            font-size: 11px;
            color: var(--text-dim);
            margin-top: 10px;
        }

        .pricing-note a {
            color: var(--text-muted);
            text-decoration: none;
            border-bottom: 1px solid var(--border);
            transition: all 0.2s;
        }

        .pricing-note a:hover {
            color: var(--accent);
            border-color: var(--accent);
        }

        .live-api-section {
            margin-top: 10px;
            padding: 14px 16px;
            background: var(--purple-dim);
            border: 1px solid #a78bfa20;
            border-radius: 10px;
        }

        .live-api-label {
            font-family: var(--font-mono);
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--purple);
            margin-bottom: 10px;
        }

        .live-api-grid {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .live-api-stat {
            flex: 1;
            min-width: 80px;
        }

        .live-api-stat .model-stat-value {
            font-size: 14px;
            color: var(--purple);
        }

        .model-tags {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-top: 14px;
        }

        .tag {
            font-family: var(--font-mono);
            font-size: 10px;
            padding: 4px 10px;
            border-radius: 6px;
            background: var(--bg-elevated);
            color: var(--text-dim);
            border: 1px solid var(--border);
        }

        .tag.thinking {
            background: var(--red-dim);
            color: var(--red);
            border-color: #f8717130;
        }

        .tag.generate {
            background: var(--green-dim);
            color: var(--green);
            border-color: #34d39930;
        }

        .tag.embed {
            background: var(--amber-dim);
            color: var(--amber);
            border-color: #fbbf2430;
        }

        .empty {
            text-align: center;
            padding: 80px 20px;
            color: var(--text-dim);
            font-size: 14px;
        }

        .loading {
            text-align: center;
            padding: 80px 20px;
            color: var(--text-muted);
            font-size: 14px;
        }

        .loading::after {
            content: '';
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-left: 10px;
            vertical-align: middle;
        }

        /* Animations */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-6px); }
            40% { transform: translateX(6px); }
            60% { transform: translateX(-4px); }
            80% { transform: translateX(4px); }
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Responsive */
        @media (max-width: 700px) {
            h1 { font-size: 36px; }
            .header-content { flex-direction: column; align-items: flex-start; }
            .header-controls { width: 100%; flex-direction: column; }
            .header-controls .field { min-width: unset; width: 100%; }
            button { width: 100%; }
            .model-card { padding: 20px; }
        }
    </style>
</head>
<body>
    <div class="page">
        <div class="header">
            <nav class="nav">
                <span class="nav-brand">Gemini Tools</span>
                <a href="index.html" class="nav-link">Token Counter</a>
            </nav>

            <div class="header-content">
                <div class="header-left">
                    <h1>Model <em>Explorer</em></h1>
                    <p class="subtitle">Browse all available Gemini models, capabilities, and pricing.</p>
                </div>
                <div class="header-controls">
                    <div class="field">
                        <label for="api-key-input">API Key</label>
                        <input type="password" id="api-key-input" placeholder="Your Gemini key" autocomplete="off" data-lpignore="true" data-1p-ignore>
                    </div>
                    <button id="load-btn" onclick="loadModels()">Load Models</button>
                </div>
            </div>

            <div class="privacy-notice">
                <svg class="privacy-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                <span>API key stays in browser memory only &mdash; sent directly to Google, cleared on page close.</span>
            </div>
        </div>

        <div class="toolbar" id="toolbar">
            <input type="text" id="search" placeholder="Search models..." oninput="applyFilters()">
            <div class="stats" id="stats"></div>
        </div>

        <div class="model-count" id="model-count"></div>

        <div class="error" id="error"></div>

        <div class="model-grid" id="model-grid">
            <div class="empty">Enter your API key and click "Load Models" to browse available models.</div>
        </div>
    </div>

    <script>
        const API_BASE = 'https://generativelanguage.googleapis.com/v1beta';

        let PRICING_DATA = {};
        let PRICING_DATE = '';
        let pricingLoaded = false;
        let PRICING_KEYS = [];

        async function loadPricing() {
            try {
                const resp = await fetch('./pricing.json');
                if (!resp.ok) throw new Error('Failed to load pricing.json');
                const data = await resp.json();
                PRICING_DATA = data.models || {};
                PRICING_DATE = data.date || '';
                PRICING_KEYS = Object.keys(PRICING_DATA).sort((a, b) => b.length - a.length);
                pricingLoaded = true;
            } catch (err) {
                console.warn('Could not load pricing.json:', err.message);
            }
        }

        function getPricing(modelId) {
            if (PRICING_DATA[modelId]) return PRICING_DATA[modelId];
            for (const key of PRICING_KEYS) {
                if (modelId.startsWith(key)) return PRICING_DATA[key];
            }
            return null;
        }

        loadPricing();

        let allModels = [];
        let activeFilter = 'all';

        async function loadModels() {
            const apiKey = document.getElementById('api-key-input').value.trim();
            const error = document.getElementById('error');
            const grid = document.getElementById('model-grid');
            const btn = document.getElementById('load-btn');

            error.classList.remove('visible');

            if (!apiKey) {
                error.textContent = 'Please enter your Gemini API key.';
                error.classList.add('visible');
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Loading\u2026';
            grid.textContent = '';
            const loadingEl = document.createElement('div');
            loadingEl.className = 'loading';
            loadingEl.textContent = 'Fetching models';
            grid.appendChild(loadingEl);

            try {
                allModels = [];
                let pageToken = '';

                do {
                    let url = `${API_BASE}/models?key=${encodeURIComponent(apiKey)}&pageSize=1000`;
                    if (pageToken) url += `&pageToken=${encodeURIComponent(pageToken)}`;

                    const resp = await fetch(url);
                    const data = await resp.json();
                    if (data.error) throw new Error(data.error.message || 'API error');
                    allModels = allModels.concat(data.models || []);
                    pageToken = data.nextPageToken || '';
                } while (pageToken);

                allModels.sort((a, b) => (a.displayName || a.name).localeCompare(b.displayName || b.name));

                document.getElementById('toolbar').classList.add('visible');
                activeFilter = 'all';
                buildChips();
                applyFilters();
            } catch (err) {
                grid.textContent = '';
                error.textContent = err.message;
                error.classList.add('visible');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Load Models';
            }
        }

        function getCounts(models) {
            return {
                all: models.length,
                generative: models.filter(m => m.supportedGenerationMethods?.includes('generateContent')).length,
                embedding: models.filter(m => m.supportedGenerationMethods?.includes('embedContent')).length,
                thinking: models.filter(m => m.thinking).length,
                priced: models.filter(m => getPricing(m.name?.replace('models/', '') || '')).length,
            };
        }

        function buildChips() {
            const counts = getCounts(allModels);
            const statsDiv = document.getElementById('stats');
            statsDiv.textContent = '';
            [
                { key: 'all',        label: `All ${counts.all}` },
                { key: 'generative', label: `Generative ${counts.generative}` },
                { key: 'embedding',  label: `Embedding ${counts.embedding}` },
                { key: 'thinking',   label: `Thinking ${counts.thinking}` },
                { key: 'priced',     label: `Priced ${counts.priced}` },
            ].forEach(c => {
                const chip = document.createElement('div');
                chip.className = 'stat-chip' + (activeFilter === c.key ? ' active' : '');
                chip.dataset.filter = c.key;
                chip.textContent = c.label;
                chip.addEventListener('click', () => toggleFilter(c.key));
                statsDiv.appendChild(chip);
            });
        }

        function toggleFilter(key) {
            activeFilter = activeFilter === key ? 'all' : key;
            buildChips();
            applyFilters();
        }

        function applyFilters() {
            const query = document.getElementById('search').value.toLowerCase();
            let filtered = allModels;

            if (activeFilter === 'generative') {
                filtered = filtered.filter(m => m.supportedGenerationMethods?.includes('generateContent'));
            } else if (activeFilter === 'embedding') {
                filtered = filtered.filter(m => m.supportedGenerationMethods?.includes('embedContent'));
            } else if (activeFilter === 'thinking') {
                filtered = filtered.filter(m => m.thinking);
            } else if (activeFilter === 'priced') {
                filtered = filtered.filter(m => getPricing(m.name?.replace('models/', '') || ''));
            }

            if (query) {
                filtered = filtered.filter(m => {
                    const name = (m.displayName || '').toLowerCase();
                    const id = (m.name || '').toLowerCase();
                    const desc = (m.description || '').toLowerCase();
                    return name.includes(query) || id.includes(query) || desc.includes(query);
                });
            }

            const countEl = document.getElementById('model-count');
            countEl.style.display = 'block';
            countEl.textContent = `Showing ${filtered.length} of ${allModels.length} models`;
            renderModels(filtered);
        }

        function formatNumber(n) {
            if (n == null) return '\u2014';
            if (n >= 1000000) return (n / 1000000).toFixed(1) + 'M';
            if (n >= 1000) return (n / 1000).toFixed(0) + 'K';
            return n.toLocaleString();
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function renderModels(models) {
            const grid = document.getElementById('model-grid');
            grid.textContent = '';

            if (models.length === 0) {
                const empty = document.createElement('div');
                empty.className = 'empty';
                empty.textContent = 'No models found.';
                grid.appendChild(empty);
                return;
            }

            models.forEach((m, i) => {
                const modelId = m.name?.replace('models/', '') || '';
                const methods = m.supportedGenerationMethods || [];

                const card = document.createElement('div');
                card.className = 'model-card';
                card.style.animationDelay = `${Math.min(i * 0.03, 0.5)}s`;

                let cardHTML = `
                    <div class="model-card-header">
                        <div>
                            <div class="model-name">${escapeHtml(m.displayName || modelId)}</div>
                            <div class="model-id">${escapeHtml(modelId)}</div>
                        </div>
                        ${m.version ? `<span class="model-version">v${escapeHtml(m.version)}</span>` : ''}
                    </div>
                    ${m.description ? `<div class="model-description">${escapeHtml(m.description)}</div>` : ''}
                    <div class="model-stats">
                        <div class="model-stat">
                            <div class="model-stat-value">${formatNumber(m.inputTokenLimit)}</div>
                            <div class="model-stat-label">Input tokens</div>
                        </div>
                        <div class="model-stat">
                            <div class="model-stat-value">${formatNumber(m.outputTokenLimit)}</div>
                            <div class="model-stat-label">Output tokens</div>
                        </div>
                    </div>
                    ${renderPricing(modelId)}`;

                const tags = [];
                if (m.thinking) tags.push({ cls: 'thinking', text: 'Thinking' });
                if (methods.includes('generateContent')) tags.push({ cls: 'generate', text: 'generateContent' });
                if (methods.includes('embedContent')) tags.push({ cls: 'embed', text: 'embedContent' });
                methods.filter(x => x !== 'generateContent' && x !== 'embedContent')
                    .forEach(x => tags.push({ cls: '', text: x }));

                if (tags.length) {
                    cardHTML += '<div class="model-tags">';
                    tags.forEach(t => {
                        cardHTML += `<span class="tag ${t.cls}">${escapeHtml(t.text)}</span>`;
                    });
                    cardHTML += '</div>';
                }

                card.innerHTML = cardHTML;
                grid.appendChild(card);
            });
        }

        function renderPricing(modelId) {
            const p = getPricing(modelId);
            if (!p) {
                return '<div class="pricing-note">Pricing unavailable &mdash; <a href="https://cloud.google.com/vertex-ai/generative-ai/pricing" target="_blank">check pricing page</a></div>';
            }
            let html = `
                <div class="model-pricing">
                    <div class="model-pricing-stat">
                        <div class="model-stat-value">$${escapeHtml(String(p.input))}</div>
                        <div class="model-stat-label">Input / 1M</div>
                    </div>
                    <div class="model-pricing-stat">
                        <div class="model-stat-value">$${escapeHtml(String(p.output))}</div>
                        <div class="model-stat-label">Output / 1M</div>
                    </div>
                    ${p.inputAudio != null ? `
                    <div class="model-pricing-stat">
                        <div class="model-stat-value">$${escapeHtml(String(p.inputAudio))}</div>
                        <div class="model-stat-label">Audio in / 1M</div>
                    </div>` : ''}
                    ${p.cached != null ? `
                    <div class="model-pricing-stat">
                        <div class="model-stat-value">$${escapeHtml(String(p.cached))}</div>
                        <div class="model-stat-label">Cached / 1M</div>
                    </div>` : ''}
                    ${p.imageOutput != null ? `
                    <div class="model-pricing-stat">
                        <div class="model-stat-value">$${escapeHtml(String(p.imageOutput))}</div>
                        <div class="model-stat-label">Img out / 1M</div>
                    </div>` : ''}
                </div>`;

            if (p.note) {
                html += `<div class="pricing-note" style="color: var(--red);">${escapeHtml(p.note)}</div>`;
            }

            if (p.live) {
                html += `
                <div class="live-api-section">
                    <div class="live-api-label">Live API / 1M tokens</div>
                    <div class="live-api-grid">
                        <div class="live-api-stat">
                            <div class="model-stat-value">$${escapeHtml(String(p.live.inputText))}</div>
                            <div class="model-stat-label">Text in</div>
                        </div>
                        <div class="live-api-stat">
                            <div class="model-stat-value">$${escapeHtml(String(p.live.inputAudio))}</div>
                            <div class="model-stat-label">Audio in</div>
                        </div>
                        <div class="live-api-stat">
                            <div class="model-stat-value">$${escapeHtml(String(p.live.inputVideo))}</div>
                            <div class="model-stat-label">Video in</div>
                        </div>
                        <div class="live-api-stat">
                            <div class="model-stat-value">$${escapeHtml(String(p.live.outputText))}</div>
                            <div class="model-stat-label">Text out</div>
                        </div>
                        <div class="live-api-stat">
                            <div class="model-stat-value">$${escapeHtml(String(p.live.outputAudio))}</div>
                            <div class="model-stat-label">Audio out</div>
                        </div>
                    </div>
                </div>`;
            }

            html += `<div class="pricing-note">As of ${escapeHtml(PRICING_DATE || 'unknown date')} &mdash; <a href="https://cloud.google.com/vertex-ai/generative-ai/pricing" target="_blank">verify pricing</a></div>`;
            return html;
        }

        window.addEventListener('beforeunload', () => {
            document.getElementById('api-key-input').value = '';
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src https://generativelanguage.googleapis.com;">
    <title>Gemini Tools</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="nav.css">
    <style>
        :root {
            --bg: #ffffff;
            --bg-elevated: #f5f6f8;
            --bg-card: #ffffff;
            --border: #e2e4e9;
            --border-focus: #4f46e5;
            --text: #111318;
            --text-secondary: #4b5060;
            --text-muted: #8b90a0;
            --accent: #4f46e5;
            --accent-hover: #4338ca;
            --accent-soft: #eef2ff;
            --green: #059669;
            --green-soft: #ecfdf5;
            --red: #dc2626;
            --red-soft: #fef2f2;
            --amber: #d97706;
            --amber-soft: #fffbeb;
            --purple: #7c3aed;
            --purple-soft: #f5f3ff;
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
            --shadow-lg: 0 8px 24px rgba(0,0,0,0.1);
            --radius: 12px;
        }

        [data-theme="dark"] {
            --bg: #0e1117;
            --bg-elevated: #161b26;
            --bg-card: #1c2132;
            --border: #2a3045;
            --border-focus: #818cf8;
            --text: #eceef4;
            --text-secondary: #9399ae;
            --text-muted: #5c6280;
            --accent: #818cf8;
            --accent-hover: #a5b4fc;
            --accent-soft: #1e1b4b40;
            --green: #34d399;
            --green-soft: #05966920;
            --red: #f87171;
            --red-soft: #dc262620;
            --amber: #fbbf24;
            --amber-soft: #d9770620;
            --purple: #a78bfa;
            --purple-soft: #7c3aed20;
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.2);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.3);
            --shadow-lg: 0 8px 24px rgba(0,0,0,0.4);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            transition: background 0.3s, color 0.3s;
        }

        .hero {
            max-width: 1200px;
            margin: 0 auto;
            padding: 60px 32px 20px;
        }

        .hero-label {
            font-family: 'Space Mono', monospace;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--accent);
            margin-bottom: 16px;
            opacity: 0;
            animation: fadeUp 0.6s ease forwards;
        }

        .hero h1 {
            font-size: clamp(36px, 5vw, 56px);
            font-weight: 700;
            letter-spacing: -0.035em;
            line-height: 1.1;
            color: var(--text);
            margin-bottom: 12px;
            opacity: 0;
            animation: fadeUp 0.6s ease 0.1s forwards;
        }

        .hero h1 span {
            background: linear-gradient(135deg, var(--accent), var(--purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .hero p {
            font-size: 17px;
            color: var(--text-secondary);
            max-width: 520px;
            line-height: 1.6;
            opacity: 0;
            animation: fadeUp 0.6s ease 0.2s forwards;
        }

        .tool-count {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 20px;
            padding: 6px 14px;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: 100px;
            font-family: 'Space Mono', monospace;
            font-size: 12px;
            color: var(--text-muted);
            opacity: 0;
            animation: fadeUp 0.6s ease 0.3s forwards;
        }

        .tool-count strong {
            color: var(--accent);
            font-size: 14px;
        }

        /* Sections */
        .sections {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px 32px 80px;
        }

        .section {
            margin-bottom: 48px;
            opacity: 0;
            animation: fadeUp 0.5s ease forwards;
        }

        .section:nth-child(1) { animation-delay: 0.35s; }
        .section:nth-child(2) { animation-delay: 0.45s; }
        .section:nth-child(3) { animation-delay: 0.55s; }
        .section:nth-child(4) { animation-delay: 0.65s; }
        .section:nth-child(5) { animation-delay: 0.75s; }

        .section-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
        }

        .section-icon {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
        }

        .section-title {
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-muted);
        }

        .section-line {
            flex: 1;
            height: 1px;
            background: var(--border);
            margin-left: 8px;
        }

        /* Cards Grid */
        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 14px;
        }

        .card {
            position: relative;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 22px 22px 20px;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
            cursor: pointer;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--card-accent, var(--accent)), transparent);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .card:hover {
            border-color: var(--card-accent, var(--accent));
            box-shadow: var(--shadow-lg);
            transform: translateY(-4px);
        }

        .card:hover::before {
            opacity: 1;
        }

        .card-top {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .card-emoji {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            background: var(--card-bg, var(--accent-soft));
            flex-shrink: 0;
        }

        .card-arrow {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            color: var(--text-muted);
            font-size: 14px;
            transition: all 0.25s ease;
            opacity: 0;
            transform: translateX(-4px);
        }

        .card:hover .card-arrow {
            opacity: 1;
            transform: translateX(0);
            background: var(--card-accent, var(--accent));
            border-color: var(--card-accent, var(--accent));
            color: #fff;
        }

        .card-name {
            font-size: 16px;
            font-weight: 600;
            letter-spacing: -0.01em;
            margin-bottom: 4px;
            color: var(--text);
            transition: color 0.2s;
        }

        .card:hover .card-name {
            color: var(--card-accent, var(--accent));
        }

        .card-desc {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.5;
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            transition: max-height 0.35s ease, opacity 0.25s ease, margin 0.3s ease;
            margin-top: 0;
        }

        .card:hover .card-desc {
            max-height: 60px;
            opacity: 1;
            margin-top: 6px;
        }

        .card-tag {
            display: inline-block;
            margin-top: 10px;
            padding: 3px 10px;
            border-radius: 100px;
            font-family: 'Space Mono', monospace;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--card-accent, var(--accent));
            background: var(--card-bg, var(--accent-soft));
            opacity: 0.8;
        }

        /* Category colors */
        .section[data-cat="analyze"] { --cat-accent: #4f46e5; --cat-bg: #eef2ff; }
        .section[data-cat="vision"] { --cat-accent: #059669; --cat-bg: #ecfdf5; }
        .section[data-cat="text"] { --cat-accent: #d97706; --cat-bg: #fffbeb; }
        .section[data-cat="ai"] { --cat-accent: #7c3aed; --cat-bg: #f5f3ff; }
        .section[data-cat="creative"] { --cat-accent: #dc2626; --cat-bg: #fef2f2; }

        [data-theme="dark"] .section[data-cat="analyze"] { --cat-bg: #4f46e520; }
        [data-theme="dark"] .section[data-cat="vision"] { --cat-bg: #05966920; }
        [data-theme="dark"] .section[data-cat="text"] { --cat-bg: #d9770620; }
        [data-theme="dark"] .section[data-cat="ai"] { --cat-bg: #7c3aed20; }
        [data-theme="dark"] .section[data-cat="creative"] { --cat-bg: #dc262620; }

        .section[data-cat] .card { --card-accent: var(--cat-accent); --card-bg: var(--cat-bg); }

        /* Animations */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Responsive */
        @media (max-width: 640px) {
            .hero { padding: 40px 20px 12px; }
            .sections { padding: 16px 20px 60px; }
            .cards { grid-template-columns: 1fr; gap: 10px; }
            .hero h1 { font-size: 32px; }
            .card-desc { max-height: 60px; opacity: 1; margin-top: 6px; }
            .card-arrow { opacity: 1; transform: translateX(0); }
        }
    </style>
    <script>
        (function() {
            var t = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', t);
        })();
    </script>
</head>
<body>

<div class="hero">
    <div class="hero-label">Gemini API Toolkit</div>
    <h1>Explore <span>Gemini</span> Tools</h1>
    <p>Interactive browser tools for the Gemini API. No setup required &mdash; just add your API key and start experimenting.</p>
    <div class="tool-count"><strong>19</strong> tools across 5 categories</div>
</div>

<div class="sections" id="sections"></div>

<script>
(function() {
    var tools = [
        { cat: 'Analyze', catId: 'analyze', icon: '\u{1F50D}', items: [
            { href: 'index.html', icon: '\u{1F522}', name: 'Token Counter', desc: 'Count tokens for text, images, and files. Estimate costs across all Gemini models.', tag: 'Core' },
            { href: 'models.html', icon: '\u{1F916}', name: 'Model Explorer', desc: 'Browse all available Gemini models with specs, pricing, and capability details.', tag: 'Reference' },
        ]},
        { cat: 'Vision', catId: 'vision', icon: '\u{1F441}', items: [
            { href: 'describe.html', icon: '\u{1F5BC}', name: 'Image Describer', desc: 'Upload any image and get detailed AI-generated descriptions and analysis.', tag: 'Multimodal' },
            { href: 'detect.html', icon: '\u{1F3AF}', name: 'Object Detector', desc: 'Detect and locate objects in images with labeled bounding boxes.', tag: 'Multimodal' },
            { href: 'video.html', icon: '\u{1F3AC}', name: 'Video Analyzer', desc: 'Upload videos and ask questions about their content, scenes, and details.', tag: 'Multimodal' },
        ]},
        { cat: 'Text & Data', catId: 'text', icon: '\u{1F4DD}', items: [
            { href: 'prompt.html', icon: '\u{1F4AC}', name: 'Playground', desc: 'Chat with Gemini using custom system instructions and model parameters.', tag: 'Chat' },
            { href: 'extract.html', icon: '\u{1F4CB}', name: 'Extractor', desc: 'Extract structured data from unstructured text using JSON schemas.', tag: 'Structured' },
            { href: 'embed.html', icon: '\u{1F9EE}', name: 'Embeddings', desc: 'Compute text embeddings and measure semantic similarity between passages.', tag: 'Vectors' },
            { href: 'search.html', icon: '\u{1F310}', name: 'Search', desc: 'Grounded search with Google. Get real-time, cited answers.', tag: 'Grounding' },
            { href: 'pdf.html', icon: '\u{1F4C4}', name: 'PDF Analyzer', desc: 'Upload PDFs and query their content with AI-powered analysis.', tag: 'Documents' },
            { href: 'url.html', icon: '\u{1F517}', name: 'URL Context', desc: 'Summarize and analyze web pages by providing a URL.', tag: 'Web' },
            { href: 'files.html', icon: '\u{1F4C2}', name: 'File Search', desc: 'Upload documents and search across them with natural language.', tag: 'Documents' },
        ]},
        { cat: 'AI Tools', catId: 'ai', icon: '\u2699\uFE0F', items: [
            { href: 'think.html', icon: '\u{1F9E0}', name: 'Thinking', desc: 'See the model\'s step-by-step reasoning process for complex problems.', tag: 'Reasoning' },
            { href: 'code.html', icon: '\u{1F4BB}', name: 'Code Runner', desc: 'Generate and execute Python code with automatic error correction.', tag: 'Execution' },
            { href: 'maps.html', icon: '\u{1F5FA}\uFE0F', name: 'Maps', desc: 'Location-aware queries with Google Maps integration and visualization.', tag: 'Grounding' },
            { href: 'research.html', icon: '\u{1F50E}', name: 'Deep Research', desc: 'Multi-step research agent that synthesizes information across sources.', tag: 'Agent' },
        ]},
        { cat: 'Creative', catId: 'creative', icon: '\u{1F3A8}', items: [
            { href: 'tts.html', icon: '\u{1F399}\uFE0F', name: 'Text to Speech', desc: 'Generate natural-sounding speech from text with multiple voice options.', tag: 'Audio' },
            { href: 'story.html', icon: '\u{1F4D6}', name: 'Story Illustrator', desc: 'Generate illustrated storybooks with consistent characters and scenes.', tag: 'Images' },
            { href: 'animate.html', icon: '\u{1F3AC}', name: 'Animated Video', desc: 'Create AI-generated story videos with narration and animation.', tag: 'Video' },
        ]},
    ];

    var container = document.getElementById('sections');

    tools.forEach(function(cat) {
        var section = document.createElement('div');
        section.className = 'section';
        section.setAttribute('data-cat', cat.catId);

        var header = document.createElement('div');
        header.className = 'section-header';

        var icon = document.createElement('div');
        icon.className = 'section-icon';
        icon.style.background = 'var(--cat-bg)';
        icon.textContent = cat.icon;
        header.appendChild(icon);

        var title = document.createElement('span');
        title.className = 'section-title';
        title.textContent = cat.cat;
        header.appendChild(title);

        var line = document.createElement('div');
        line.className = 'section-line';
        header.appendChild(line);

        section.appendChild(header);

        var grid = document.createElement('div');
        grid.className = 'cards';

        cat.items.forEach(function(item) {
            var a = document.createElement('a');
            a.className = 'card';
            a.href = item.href;

            var top = document.createElement('div');
            top.className = 'card-top';

            var emoji = document.createElement('div');
            emoji.className = 'card-emoji';
            emoji.textContent = item.icon;
            top.appendChild(emoji);

            var arrow = document.createElement('div');
            arrow.className = 'card-arrow';
            arrow.textContent = '\u2192';
            top.appendChild(arrow);

            a.appendChild(top);

            var name = document.createElement('div');
            name.className = 'card-name';
            name.textContent = item.name;
            a.appendChild(name);

            var desc = document.createElement('div');
            desc.className = 'card-desc';
            desc.textContent = item.desc;
            a.appendChild(desc);

            var tag = document.createElement('span');
            tag.className = 'card-tag';
            tag.textContent = item.tag;
            a.appendChild(tag);

            grid.appendChild(a);
        });

        section.appendChild(grid);
        container.appendChild(section);
    });
})();
</script>

<script src="nav.js"></script>
</body>
</html>
